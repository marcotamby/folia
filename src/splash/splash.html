<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folia - Caricamento...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #FAFAF8;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      -webkit-app-region: drag;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
    }

    .logo-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -15px;
      background: radial-gradient(circle, rgba(74, 175, 80, 0.3) 0%, rgba(250, 250, 248, 0) 70%);
      border-radius: 50%;
      animation: pulse 2.5s infinite ease-in-out;
    }

    .logo-img {
      width: 125px;
      height: 125px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 6px 12px rgba(46, 125, 50, 0.2));
      animation: float 3.5s ease-in-out infinite;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1A3026;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #2E7D32;
      opacity: 0.85;
      margin-bottom: 28px;
    }

    .progress-track {
      width: 260px;
      height: 5px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #43A047, #1B5E20);
      border-radius: 999px;
      transition: width 0.3s ease;
      animation: load 2.4s ease-in-out infinite;
    }

    .status-text {
      font-size: 12px;
      color: #667085;
      font-weight: 400;
      height: 16px;
    }

    .version-tag {
      position: absolute;
      bottom: 16px;
      font-size: 10px;
      color: #98A2B3;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes load {
      0% { width: 5%; margin-left: 0%; }
      50% { width: 70%; margin-left: 20%; }
      100% { width: 95%; margin-left: 5%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="../../assets/logo.png" alt="Folia Logo" class="logo-img" onerror="this.src='../../assets/logo.jpg'" />
    </div>

    <h1 class="brand-title">Folia</h1>
    <div class="brand-subtitle">Studio di Scrittura</div>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div id="status" class="status-text">Inizializzazione ambiente di scrittura...</div>
  </div>

  <div class="version-tag">Folia v1.0.0 &bull; Local & Private</div>

  <script>
    const messages = [
      "Inizializzazione ambiente di scrittura...",
      "Caricamento schede personaggi e trame...",
      "Configurazione salvataggio automatico...",
      "Apertura manoscritto in corso..."
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      const el = document.getElementById('status');
      if (el) el.textContent = messages[idx];
    }, 600);
  </script>
</body>
</html>
